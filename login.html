<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MR4 Distribuidora — Login</title>
<link rel="icon" type="image/png" href="./assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&display=swap" rel="stylesheet">
<style>
/* ── Tokens (mesmo sistema da home) ───────────────────────────────────── */
:root {
  --blue:        #1a73e8;
  --blue-hover:  #1557b0;
  --blue-ring:   rgba(26,115,232,.18);
  --red:         #d93025;
  --red-light:   #fce8e6;
  --red-border:  rgba(217,48,37,.25);
  --bg:          #f5f5f5;
  --surface:     #ffffff;
  --text:        #202124;
  --text2:       #5f6368;
  --border:      #dadce0;
  --radius:      10px;
}

*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  -webkit-font-smoothing: antialiased;
}

/* ── Material Symbols ──────────────────────────────────────────────────── */
.material-symbols-outlined {
  font-family: 'Material Symbols Outlined';
  font-weight: normal;
  font-style: normal;
  font-size: 20px;
  display: inline-block;
  line-height: 1;
  text-transform: none;
  letter-spacing: normal;
  word-wrap: normal;
  white-space: nowrap;
  direction: ltr;
  user-select: none;
}

/* ── Card ──────────────────────────────────────────────────────────────── */
.login-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 16px;
  padding: 40px 36px 32px;
  width: 100%;
  max-width: 400px;
}

/* ── Cabeçalho ─────────────────────────────────────────────────────────── */
.card-header {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  margin-bottom: 28px;
}

.brand-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--blue);
  color: #fff;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .5px;
  border-radius: 7px;
  width: 32px;
  height: 32px;
  flex-shrink: 0;
}

.logo-img {
  height: 36px;
  max-width: 100%;
  object-fit: contain;
}

.card-titles { text-align: center; }

.card-title {
  font-size: 19px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -.3px;
}

.card-sub {
  font-size: 13px;
  color: var(--text2);
  margin-top: 4px;
}

/* ── Erro ──────────────────────────────────────────────────────────────── */
.msg-erro {
  background: var(--red-light);
  border: 1px solid var(--red-border);
  border-radius: 8px;
  color: var(--red);
  font-size: 13px;
  font-weight: 500;
  padding: 10px 14px;
  margin-bottom: 16px;
  display: none;
  line-height: 1.45;
}

.msg-erro.show { display: block; }

/* ── Campos ────────────────────────────────────────────────────────────── */
.field {
  margin-bottom: 14px;
}

label {
  display: block;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}

input {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  color: var(--text);
  background: var(--surface);
  transition: border-color .15s, box-shadow .15s;
  outline: none;
}

input::placeholder { color: var(--text2); opacity: .7; }

input:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px var(--blue-ring);
}

/* Senha com ícone */
.senha-wrap {
  position: relative;
}

.senha-wrap input { padding-right: 44px; }

.toggle-senha {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text2);
  padding: 6px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color .12s, background .12s;
  line-height: 1;
}

.toggle-senha:hover {
  color: var(--blue);
  background: var(--blue-ring);
}

.toggle-senha:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: -2px;
}

.toggle-senha .material-symbols-outlined { font-size: 18px; }

/* ── Botão ─────────────────────────────────────────────────────────────── */
.btn-entrar {
  width: 100%;
  padding: 12px;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: .4px;
  cursor: pointer;
  transition: background .15s, box-shadow .15s, transform .1s;
  margin-top: 6px;
}

.btn-entrar:hover {
  background: var(--blue-hover);
  box-shadow: 0 2px 10px rgba(26,115,232,.3);
}

.btn-entrar:active  { transform: scale(.98); }
.btn-entrar:disabled {
  opacity: .6;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

.btn-entrar:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}

/* Loading dots (preservado — JS manipula este HTML) */
.loading-dots span {
  display: inline-block;
  animation: dot 1.4s infinite;
  font-size: 1.2rem;
}
.loading-dots span:nth-child(2) { animation-delay: .2s; }
.loading-dots span:nth-child(3) { animation-delay: .4s; }
@keyframes dot { 0%,80%,100%{opacity:0} 40%{opacity:1} }

/* ── Rodapé ────────────────────────────────────────────────────────────── */
.rodape {
  text-align: center;
  margin-top: 22px;
  font-size: 11.5px;
  color: var(--text2);
  letter-spacing: .1px;
}

/* ── Responsivo ─────────────────────────────────────────────────────────── */
@media (max-width: 440px) {
  .login-card {
    padding: 32px 20px 24px;
    border-radius: 14px;
  }
  .card-title { font-size: 17px; }
}

@media (prefers-reduced-motion: reduce) {
  .btn-entrar, input { transition: none; }
}
</style>
</head>
<body>

<div class="login-card">

  <div class="card-header">
    <div class="brand-row">
      <span class="brand-mark">MR4</span>
      <img class="logo-img" src="./assets/logo.png" alt="MR4 Distribuidora">
    </div>
    <div class="card-titles">
      <h1 class="card-title">Acesse sua conta</h1>
      <p class="card-sub">Sistema de Gestão MR4</p>
    </div>
  </div>

  <div class="msg-erro" id="msgErro"></div>

  <div class="field">
    <label for="email">E-mail</label>
    <input type="email" id="email" placeholder="seu@email.com" autocomplete="email">
  </div>

  <div class="field">
    <label for="senha">Senha</label>
    <div class="senha-wrap">
      <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password">
      <button class="toggle-senha" onclick="toggleSenha()" type="button" title="Mostrar/ocultar senha" aria-label="Mostrar ou ocultar senha">
        <span class="material-symbols-outlined" id="eyeIcon">visibility</span>
      </button>
    </div>
  </div>

  <button class="btn-entrar" id="btnEntrar" onclick="fazerLogin()">ENTRAR</button>

  <div class="rodape">MR4 Distribuidora &copy; 2026 &mdash; Acesso restrito</div>

</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, connectAuthEmulator } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

  const firebaseConfig = {
    apiKey: "AIzaSyDJRQYM4K43Bc1Lfg4EhfBz-aNtkPprAs8",
    authDomain: "mr4-ponto.firebaseapp.com",
    projectId: "mr4-ponto",
    storageBucket: "mr4-ponto.firebasestorage.app",
    messagingSenderId: "848211361584",
    appId: "1:848211361584:web:2732e1893122f4a23452f5"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
    connectAuthEmulator(auth, 'http://localhost:9099', { disableWarnings: true });
  }

  // Se já está logado, vai direto pro sistema
  onAuthStateChanged(auth, user => {
    if (user) window.location.href = './index.html';
  });

  window.fazerLogin = async function() {
    const email  = document.getElementById('email').value.trim();
    const senha  = document.getElementById('senha').value;
    const btn    = document.getElementById('btnEntrar');
    const erro   = document.getElementById('msgErro');

    erro.classList.remove('show');

    if (!email || !senha) {
      mostrarErro('Preencha e-mail e senha.');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span>';

    try {
      await signInWithEmailAndPassword(auth, email, senha);
      window.location.href = './index.html';
    } catch (e) {
      const msgs = {
        'auth/user-not-found':    'Usuário não encontrado.',
        'auth/wrong-password':    'Senha incorreta.',
        'auth/invalid-email':     'E-mail inválido.',
        'auth/too-many-requests': 'Muitas tentativas. Tente mais tarde.',
        'auth/invalid-credential':'E-mail ou senha incorretos.',
      };
      mostrarErro(msgs[e.code] || 'Erro ao entrar. Tente novamente.');
      btn.disabled = false;
      btn.textContent = 'ENTRAR';
    }
  };

  window.toggleSenha = function() {
    const inp  = document.getElementById('senha');
    const icon = document.getElementById('eyeIcon');
    if (inp.type === 'password') {
      inp.type = 'text';
      if (icon) icon.textContent = 'visibility_off';
    } else {
      inp.type = 'password';
      if (icon) icon.textContent = 'visibility';
    }
  };

  function mostrarErro(msg) {
    const el = document.getElementById('msgErro');
    el.textContent = msg;
    el.classList.add('show');
  }

  // Enter para logar
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') window.fazerLogin();
  });
</script>

</body>
</html>
