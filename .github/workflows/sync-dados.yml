name: Sync Dados GestãoClick

on:
  schedule:
    - cron: '0 */2 * * *'    # a cada 2 horas
  workflow_dispatch:           # permite rodar manualmente

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read    # SECURITY HOTFIX P0: o sync não grava mais nada no repositório público
      id-token: write   # obrigatório para GitHub Actions OIDC → WIF

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Autenticar no Google Cloud (OIDC/WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/848211361584/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: 'mr4-sync@mr4-ponto.iam.gserviceaccount.com'

      - name: Instalar dependências do sync
        run: npm install --prefix scripts --omit=dev --no-audit --no-fund

      - name: Executar sync
        env:
          GC_ACCESS_TOKEN:        ${{ secrets.GC_ACCESS_TOKEN }}
          GC_SECRET_ACCESS_TOKEN: ${{ secrets.GC_SECRET_ACCESS_TOKEN }}
        run: node scripts/sync-dados.js
      # SECURITY HOTFIX P0: removido o passo "Commit e push dos dados". Vendas, estoque e catálogo
      # agora vão para o Firestore protegido (painel_cache); data/*.json não é mais publicado.
